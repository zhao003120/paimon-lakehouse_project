# ================================================================
# sql-defaults.yaml: Flink SQL Client defaults
# ================================================================
# Used by run-sql.sh when executing SQL files
# Catalog is auto-created on every session start

execution:
  planner: streaming
  result-mode: tableau
  parallelism: 4

configuration:
  table.exec.source.idle-timeout: 30s
  table.exec.mini-batch.enabled: true
  table.exec.mini-batch.allow-latency: 5s
  table.exec.mini-batch.size: 100

# ================================================================
# Auto-create Paimon Catalog on every session start
# This means you DON'T need to run 00-catalog.sql manually
# ================================================================
catalogs:
  - name: paimon
    type: paimon
    warehouse: "s3://paimon/warehouse"
    s3.endpoint: "http://minio:9000"
    s3.access-key: "admin"
    s3.secret-key: "admin123"
    s3.path.style.access: "true"
