# ================================================================
# sql-defaults.yaml: Flink SQL Client defaults
# ================================================================
# Catalog is NOT configured here (unreliable across Flink versions)
# Instead, run-sql.sh auto-injects 00-catalog.sql into every session

execution:
  type: batch
  result-mode: tableau
  parallelism: 4

configuration:
  table.exec.source.idle-timeout: 30s
  table.exec.adaptive-parallelism.enabled: false
