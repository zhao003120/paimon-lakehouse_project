services:
  # ================================================================
  # MinIO: S3-compatible object storage for Paimon
  # ================================================================
  minio:
    image: minio/minio:latest
    container_name: paimon-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: paimon-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 admin admin123;
      mc mb local/paimon --ignore-existing;
      echo 'Bucket paimon created';
      "
    restart: "no"

  # ================================================================
  # Flink: ETL pipeline (write to Paimon)
  # ================================================================
  jobmanager:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: paimon-jobmanager
    hostname: jobmanager
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
    environment:
      - FLINK_HOME=/opt/flink
      - JOB_MANAGER_RPC_ADDRESS=jobmanager
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=admin
      - S3_SECRET_KEY=admin123
    volumes:
      - ../:/app
      - ./flink-conf.yaml:/opt/flink/conf/flink-conf.yaml
    command: jobmanager
    stdin_open: true
    tty: true

  taskmanager:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: paimon-taskmanager
    hostname: taskmanager
    depends_on:
      - jobmanager
    environment:
      - FLINK_HOME=/opt/flink
      - JOB_MANAGER_RPC_ADDRESS=jobmanager
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=admin
      - S3_SECRET_KEY=admin123
    volumes:
      - ../:/app
      - ./flink-conf.yaml:/opt/flink/conf/flink-conf.yaml
    command: taskmanager
    stdin_open: true
    tty: true

  # ================================================================
  # StarRocks FE (Frontend)
  # ================================================================
  starrocks-fe:
    image: starrocks/fe-ubuntu:3.3.2
    container_name: paimon-starrocks-fe
    hostname: starrocks-fe
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8030:8030"
      - "9020:9020"
      - "9030:9030"
    environment:
      - MYSQL_PORT=9030
    volumes:
      - starrocks-fe-meta:/opt/starrocks/fe/meta
      - ./starrocks-config/fe-start.sh:/opt/starrocks/fe/fe-start.sh
    entrypoint: ["bash", "/opt/starrocks/fe/fe-start.sh"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9030' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ================================================================
  # StarRocks BE (Backend)
  # ================================================================
  starrocks-be:
    image: starrocks/be-ubuntu:3.3.2
    container_name: paimon-starrocks-be
    hostname: starrocks-be
    depends_on:
      starrocks-fe:
        condition: service_healthy
    ports:
      - "8040:8040"
      - "9050:9050"
      - "9060:9060"
    environment:
      - FE_HOST=starrocks-fe
      - FE_PORT=9020
      - BE_PORT=9050
    volumes:
      - starrocks-be-storage:/opt/starrocks/be/storage
      - ./starrocks-config/be-start.sh:/opt/starrocks/be/be-start.sh
    entrypoint: ["bash", "/opt/starrocks/be/be-start.sh"]

volumes:
  minio-data:
  starrocks-fe-meta:
  starrocks-be-storage:
