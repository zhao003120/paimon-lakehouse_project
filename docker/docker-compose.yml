version: "3.8"

services:
  # ================================================================
  # MinIO: S3-compatible object storage for Paimon
  # ================================================================
  minio:
    image: minio/minio:latest
    container_name: paimon-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: paimon-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 admin admin123;
      mc mb local/paimon --ignore-existing;
      echo 'Bucket paimon created';
      "
    restart: "no"

  # ================================================================
  # Flink: ETL pipeline (write to Paimon)
  # ================================================================
  jobmanager:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: paimon-jobmanager
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
    environment:
      - FLINK_HOME=/opt/flink
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=admin
      - S3_SECRET_KEY=admin123
    volumes:
      - ../:/app
    command: jobmanager
    stdin_open: true
    tty: true

  taskmanager:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: paimon-taskmanager
    depends_on:
      - jobmanager
    environment:
      - FLINK_HOME=/opt/flink
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=admin
      - S3_SECRET_KEY=admin123
    volumes:
      - ../:/app
    command: taskmanager
    stdin_open: true
    tty: true

  # ================================================================
  # StarRocks FE (Frontend): metadata + query planning + CBO
  # ================================================================
  starrocks-fe:
    image: starrocks/fe-ubuntu:3.3.2
    container_name: paimon-starrocks-fe
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8030:8030"   # FE HTTP (Web UI)
      - "9020:9020"   # FE thrift (BE connects here)
      - "9030:9030"   # FE MySQL (SQL client connects here)
    environment:
      - MYSQL_PORT=9030
    volumes:
      - starrocks-fe-meta:/opt/starrocks/fe/meta
      - ../sql/starrocks:/app/sql/starrocks
    command: >
      bash /opt/starrocks/fe/bin/start_fe.sh --host_type FQDN
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -sf http://localhost:8030/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ================================================================
  # StarRocks BE (Backend): MPP execution + Data Cache + vectorized engine
  # ================================================================
  starrocks-be:
    image: starrocks/be-ubuntu:3.3.2
    container_name: paimon-starrocks-be
    depends_on:
      starrocks-fe:
        condition: service_healthy
    ports:
      - "8040:8040"   # BE HTTP
      - "9050:9050"   # BE thrift
      - "9060:9060"   # BE webserver
    environment:
      - FE_HOST=starrocks-fe
      - FE_PORT=9020
      - BE_PORT=9050
    volumes:
      - starrocks-be-storage:/opt/starrocks/be/storage
    command: >
      bash -c "
      sleep 10 &&
      /opt/starrocks/be/bin/start_be.sh --host_type FQDN
      "

volumes:
  minio-data:
  starrocks-fe-meta:
  starrocks-be-storage:
