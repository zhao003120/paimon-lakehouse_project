version: "3.8"

services:
  # ================================================================
  # MinIO: S3-compatible object storage for Paimon
  # ================================================================
  minio:
    image: minio/minio:latest
    container_name: paimon-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Auto-create the "paimon" bucket after MinIO starts
  minio-init:
    image: minio/mc:latest
    container_name: paimon-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 admin admin123;
      mc mb local/paimon --ignore-existing;
      echo 'Bucket paimon created';
      "
    restart: "no"

  # ================================================================
  # Flink Job Runner: build & run paimon-lakehouse_project
  # ================================================================
  jobmanager:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: paimon-jobmanager
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8081:8081"   # Flink Web UI
    environment:
      - FLINK_HOME=/opt/flink
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=admin
      - S3_SECRET_KEY=admin123
    volumes:
      - ../:/app
      - maven-repo:/root/.m2
    command: jobmanager
    stdin_open: true
    tty: true

  taskmanager:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: paimon-taskmanager
    depends_on:
      - jobmanager
    environment:
      - FLINK_HOME=/opt/flink
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=admin
      - S3_SECRET_KEY=admin123
    volumes:
      - ../:/app
      - maven-repo:/root/.m2
    command: taskmanager
    stdin_open: true
    tty: true

volumes:
  minio-data:
  maven-repo:
